<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concept 1: Minimal Button</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: #0a0a0a;
      color: #f3f4f6;
      padding: 80px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 60px;
    }
    .concept-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 40px;
      text-align: center;
    }
    .cta-container {
      background: #1a1a1a;
      padding: 60px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #888;
      margin-bottom: 20px;
    }

    /* Minimal Button Concept */
    .minimal-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: transparent;
      border: 1px solid hsl(276 70% 55%);
      color: hsl(276 70% 65%);
      font-size: 14px;
      font-weight: 500;
      border-radius: 6px;
      text-decoration: none;
      transition: all 200ms ease;
      cursor: pointer;
    }
    .minimal-button:hover {
      background: hsl(276 70% 55% / 0.1);
      border-color: hsl(276 70% 65%);
      transform: translateY(-1px);
    }
    .minimal-button svg {
      width: 16px;
      height: 16px;
      transition: transform 200ms ease;
    }
    .minimal-button:hover svg {
      transform: translateX(2px);
    }

    .notes {
      margin-top: 40px;
      max-width: 500px;
      text-align: center;
      font-size: 14px;
      color: #888;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="concept-title">Concept 1: Minimal Button</div>

  <div class="cta-container">
    <div class="label">Default State</div>
    <a href="#" class="minimal-button">
      View all case studies
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M3 8h10M9 4l4 4-4 4"/>
      </svg>
    </a>
  </div>

  <div class="notes">
    <strong>Rationale:</strong> Ultra-minimal ghost button with subtle purple border. Hover adds minimal background tint and slight lift. Arrow animation provides feedback. Feels refined without being heavy-handed.
  </div>

</body>
</html>
