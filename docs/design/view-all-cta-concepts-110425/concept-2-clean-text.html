<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concept 2: Clean Text Treatment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: #0a0a0a;
      color: #f3f4f6;
      padding: 80px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 60px;
    }
    .concept-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 40px;
      text-align: center;
    }
    .cta-container {
      background: #1a1a1a;
      padding: 60px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #888;
      margin-bottom: 20px;
    }

    /* Clean Text Treatment */
    .clean-text {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 500;
      color: hsl(276 70% 65%);
      text-decoration: none;
      position: relative;
      transition: all 300ms ease;
      cursor: pointer;
    }
    .clean-text::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      right: 0;
      height: 1px;
      background: hsl(276 70% 65%);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 300ms ease;
    }
    .clean-text:hover::after {
      transform: scaleX(1);
    }
    .clean-text:hover {
      color: hsl(276 70% 75%);
    }
    .clean-text svg {
      width: 18px;
      height: 18px;
      transition: transform 300ms ease;
    }
    .clean-text:hover svg {
      transform: translateX(4px);
    }

    .notes {
      margin-top: 40px;
      max-width: 500px;
      text-align: center;
      font-size: 14px;
      color: #888;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="concept-title">Concept 2: Clean Text Treatment</div>

  <div class="cta-container">
    <div class="label">Default State</div>
    <a href="#" class="clean-text">
      View all case studies
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M3 8h10M9 4l4 4-4 4"/>
      </svg>
    </a>
  </div>

  <div class="notes">
    <strong>Rationale:</strong> Simple text link with animated underline that draws in on hover. Arrow slides right for additional feedback. Clean and minimal with just enough visual interest. No container, no background - pure simplicity.
  </div>

</body>
</html>
