<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concept 2: Split Hero Layout - Dark Mode</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            background: 'hsl(240, 10%, 3%)',
            foreground: 'hsl(0, 0%, 98%)',
            border: 'hsl(240, 5%, 20%)',
            accent: 'hsl(276, 100%, 75%)',
            'muted-foreground': 'hsl(215, 15%, 70%)',
          },
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: hsl(240, 10%, 3%);
      color: hsl(0, 0%, 98%);
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body class="dark">

  <!-- Dark Mode Toggle -->
  <div class="fixed top-4 right-4 z-50">
    <button onclick="window.location.href='concept-2-split-layout.html'"
            class="px-4 py-2 bg-accent/20 hover:bg-accent/30 text-accent rounded-lg text-sm font-medium transition-colors">
      Switch to Light Mode
    </button>
  </div>

  <!-- Concept 2: Split Hero Layout - DARK MODE -->
  <header class="min-h-[80vh] flex items-center">
    <div class="max-w-7xl mx-auto px-6 py-16 md:py-24 w-full">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-16 items-center">

        <!-- Left: Content -->
        <div class="order-2 lg:order-1">
          <!-- Badge -->
          <div class="text-xs uppercase tracking-[2px] text-accent font-semibold mb-6">
            Mobile App
          </div>

          <!-- Title -->
          <h1 class="text-[48px] md:text-[60px] lg:text-[72px] font-bold text-foreground leading-[1.05] mb-6">
            Before Launcher
          </h1>

          <!-- Subtitle -->
          <p class="text-[20px] md:text-[24px] text-muted-foreground leading-[1.4] mb-10">
            Helping thousands reduce phone distraction by 30-40%
          </p>

          <!-- Overview Grid -->
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-6 pt-8 border-t border-border">
            <div>
              <div class="text-xs uppercase tracking-[2px] text-muted-foreground mb-2">
                Role
              </div>
              <div class="text-base text-foreground font-medium">
                Founder, Product
              </div>
            </div>
            <div>
              <div class="text-xs uppercase tracking-[2px] text-muted-foreground mb-2">
                Company
              </div>
              <div class="text-base text-foreground font-medium">
                Before Labs
              </div>
            </div>
            <div>
              <div class="text-xs uppercase tracking-[2px] text-muted-foreground mb-2">
                Timeline
              </div>
              <div class="text-base text-foreground font-medium">
                2017-2020
              </div>
            </div>
          </div>
        </div>

        <!-- Right: Image -->
        <div class="order-1 lg:order-2">
          <div class="relative aspect-[4/3] rounded-2xl overflow-hidden shadow-2xl ring-1 ring-border/50">
            <img
              src="https://images.unsplash.com/photo-1551650975-87deedd944c3?w=1200&h=900&fit=crop&auto=format&q=85"
              alt="Before Launcher mobile app interface"
              class="w-full h-full object-cover"
            />
            <!-- Subtle gradient overlay for depth in dark mode -->
            <div class="absolute inset-0 bg-gradient-to-br from-transparent via-transparent to-background/10"></div>
          </div>
        </div>

      </div>
    </div>
  </header>

  <!-- Page Content Preview -->
  <main class="max-w-4xl mx-auto px-6 py-12">
    <div class="prose prose-lg prose-invert">
      <p class="text-muted-foreground">
        Like many of us, I became increasingly distracted by my phone when more and more very useful (and less useful) apps started taking up space on my phone...
      </p>
    </div>
  </main>

</body>
</html>
