<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Footer Concept - Refined with Large Crow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Newsreader:wght@300;400;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['DM Sans', 'system-ui', 'sans-serif'],
            serif: ['Newsreader', 'Georgia', 'serif'],
          },
          colors: {
            accent: '#c780f5', // Purple accent (dark mode)
            'accent-light': '#d9a3ff',
            background: '#0a0d14',
            foreground: '#fafafa',
            navigation: '#191d28',
            border: '#2e3544',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
    }
  </style>
</head>
<body class="bg-background text-foreground min-h-screen flex flex-col">

  <!-- Simulated page content -->
  <div class="flex-1 flex items-center justify-center">
    <p class="text-muted-foreground text-sm">← Scroll down to see footer</p>
  </div>

  <!-- FOOTER - Refined: Large Crow + Vertical Services + Site Links -->
  <footer class="border-t border-border bg-navigation">
    <div class="max-w-6xl mx-auto px-6 py-8">

      <!-- Main content area: Crow+Logo | Services | Site Links | Social -->
      <div class="grid grid-cols-1 md:grid-cols-[auto_1fr_1fr_auto] gap-8 items-start mb-6">

        <!-- Left: Large Crow + MEvans logo -->
        <div class="flex flex-col items-center md:items-start gap-3">
          <svg
            width="110"
            height="135"
            viewBox="0 0 110 135"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            class="text-accent opacity-60"
            style="transform: scaleX(-1);"
          >
            <path d="M37.871 48.258C39.7069 52.6291 44.0155 56.633 48.344 59.781C48.6253 61.6091 48.5588 63.531 47.5081 64.8162L42.012 69.5271C42.012 69.5271 37.6565 69.3123 36.4456 71.1677H46.2229C46.2229 71.1677 46.2463 70.3396 44.4377 69.6677L49.8596 65.531C51.426 65.07 52.9494 64.4646 54.4026 63.7263C55.3987 64.3083 56.3167 64.8201 57.1018 65.238L52.1018 69.5232C52.1018 69.5232 47.7463 69.3083 46.5354 71.1638H56.3127C56.3127 71.1638 56.3361 70.3357 54.5275 69.6638L59.0275 66.2302C59.5939 66.5114 59.9259 66.6677 59.9259 66.6677V85.2297C64.1368 97.3627 75.7699 105 75.7699 105L74.9144 78.8747L85.8364 87.7966C85.8364 87.7966 70.5634 51.4686 67.9224 44.2576C65.2818 37.0506 62.356 34.4803 62.356 34.4803C62.3521 34.4803 57.0708 17.4213 47.794 15.4253C38.5128 13.4253 36.517 19.1245 36.517 19.1245C34.2475 18.855 31.9506 19.0034 29.7358 19.5659C27.2436 20.2651 25.2006 22.0464 24.1694 24.4175L35.6614 26.0581C40.6536 29.4136 33.5872 38.0501 37.8723 48.2571L37.871 48.258ZM42.2226 20.387C42.7499 20.387 43.2226 20.7034 43.4218 21.1878C43.621 21.6721 43.5116 22.2308 43.1406 22.598C42.7695 22.9691 42.2109 23.0823 41.7265 22.8792C41.2421 22.68 40.9257 22.2073 40.9257 21.6839C40.9257 21.3402 41.0624 21.0081 41.3085 20.7659C41.5507 20.5238 41.8789 20.387 42.2226 20.387Z" fill="currentColor"/>
          </svg>

          <!-- MEvans Logo Text -->
          <p class="text-sm font-light text-foreground/50">MEvans</p>
        </div>

        <!-- Services (vertical list) -->
        <nav class="flex flex-col gap-3 items-center md:items-start font-sans">
          <h3 class="text-xs uppercase tracking-wider text-foreground/40 mb-1">Product Management</h3>
          <a href="#" class="text-base text-foreground/70 hover:text-accent transition-colors">
            Research
          </a>
          <a href="#" class="text-base text-foreground/70 hover:text-accent transition-colors">
            Strategy
          </a>
          <a href="#" class="text-base text-foreground/70 hover:text-accent transition-colors">
            UX & Design
          </a>
          <a href="#" class="text-base text-foreground/70 hover:text-accent transition-colors">
            Delivery
          </a>
          <a href="#" class="text-base text-foreground/70 hover:text-accent transition-colors">
            Development
          </a>
        </nav>

        <!-- Site Links (vertical list) -->
        <nav class="flex flex-col gap-3 items-center md:items-start font-sans">
          <h3 class="text-xs uppercase tracking-wider text-foreground/40 mb-1">Pages</h3>
          <a href="/" class="text-base text-foreground/70 hover:text-accent transition-colors">
            Home
          </a>
          <a href="/about" class="text-base text-foreground/70 hover:text-accent transition-colors">
            About
          </a>
          <a href="/case-studies" class="text-base text-foreground/70 hover:text-accent transition-colors">
            Case Studies
          </a>
          <a href="/ai-showcase" class="text-base text-foreground/70 hover:text-accent transition-colors">
            AI Showcase
          </a>
        </nav>

        <!-- Social Links (stacked vertically) -->
        <div class="flex flex-col gap-3 items-center md:items-end font-sans">
          <h3 class="text-xs uppercase tracking-wider text-foreground/40 mb-1">Reach Out</h3>
          <a href="https://linkedin.com" class="text-base text-foreground/70 hover:text-accent transition-colors">
            LinkedIn
          </a>
          <a href="/contact" class="text-base text-accent hover:text-accent-light transition-colors">
            Contact
          </a>
        </div>
      </div>

      <!-- Bottom: Centered tagline (no italics) -->
      <div class="border-t border-border/30 pt-5">
        <p class="font-sans text-base text-foreground/80 text-center">
          made with love in <span id="weather-word" class="text-accent">rainy</span> Portland
        </p>
      </div>
    </div>
  </footer>

  <script>
    // Simulate weather word changing
    const weatherWords = ['sunny', 'rainy', 'cloudy', 'misty', 'foggy'];
    let currentIndex = 1; // Start with 'rainy'

    setInterval(() => {
      currentIndex = (currentIndex + 1) % weatherWords.length;
      document.getElementById('weather-word').textContent = weatherWords[currentIndex];
    }, 3000);
  </script>
</body>
</html>
